services:

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_password
      POSTGRES_DB: users_db
    expose:
      - "5432"
    volumes:
      - users_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_line_prefix=%m [%p] %u@%d app=%a "
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_user -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  courts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courts_user
      POSTGRES_PASSWORD: courts_password
      POSTGRES_DB: courts_db
    expose:
      - "5432"
    volumes:
      - courts_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_line_prefix=%m [%p] %u@%d app=%a "
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courts_user -d courts_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-microservice:
    build: ./users
    environment:
      SERVER_SERVLET_CONTEXT_PATH: "/users"
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK

      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users_db
      SPRING_DATASOURCE_USERNAME: users_user
      SPRING_DATASOURCE_PASSWORD: users_password

      COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/TU_USER_POOL_ID
    expose:
      - "8686"
    depends_on:
      users-db:
        condition: service_healthy

  court-microservice:
    build: ./courts_service
    environment:
      SERVER_SERVLET_CONTEXT_PATH: "/courts"
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK

      SPRING_DATASOURCE_URL: jdbc:postgresql://courts-db:5432/courts_db
      SPRING_DATASOURCE_USERNAME: courts_user
      SPRING_DATASOURCE_PASSWORD: courts_password

      COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/TU_USER_POOL_ID
    expose:
      - "8989"
    depends_on:
      courts-db:
        condition: service_healthy
      users-microservice:
        condition: service_started

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - users-microservice
      - court-microservice

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@puce.edu.ec
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      users-db:
        condition: service_healthy
      courts-db:
        condition: service_healthy

volumes:
  users_data:
  courts_data: